<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Central Valley Stars Dance Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #0B0813; color: #F3F4F6; font-family: 'Inter', sans-serif; }
        .glass-panel { background: rgba(23, 18, 38, 0.65); backdrop-filter: blur(16px); border: 1px solid rgba(168, 85, 247, 0.25); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <header class="fixed top-0 left-0 right-0 z-50">
        <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3">
            <div class="glass-panel rounded-2xl px-4 py-2.5 sm:px-6 flex items-center justify-between">
                <a href="index.html" class="flex items-center gap-3">
                    <img src="15_banner2.png" alt="Stars Dance Studio Logo" class="h-8 sm:h-10 w-auto object-contain filter drop-shadow-[0_0_10px_rgba(239,68,68,0.4)]">
                </a>
                <a href="index.html" class="px-3 py-2 rounded-xl glass-panel text-xs font-bold text-gray-300 hover:text-white flex items-center gap-1.5">
                    <i data-lucide="home" class="w-3.5 h-3.5"></i><span>Home</span>
                </a>
            </div>
        </nav>
    </header>

    <main class="flex-grow pt-32 pb-16 px-4 max-w-7xl mx-auto w-full text-center">
        <h1 class="text-3xl font-bold mb-2">Admin Submissions Portal</h1>
        <p class="text-gray-400 text-xs">Manage student inquiries securely.</p>
    </main>

    <footer class="py-6 border-t border-white/10 text-center text-xs text-gray-400">
        <p>© 2026 Central Valley Stars Dance Studio. All Rights Reserved.</p>
    </footer>

    <script>document.addEventListener('DOMContentLoaded', () => lucide.createIcons());</script>
</body>
</html>
