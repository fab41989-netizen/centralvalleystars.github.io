<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Feed | Central Valley Stars Dance Studio</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#0B0813',
                            card: 'rgba(23, 18, 38, 0.7)',
                            accent: '#8B5CF6',
                            purple: '#A855F7',
                            magenta: '#EC4899',
                            gold: '#F59E0B',
                            border: 'rgba(168, 85, 247, 0.2)'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Outfit', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0B0813;
            color: #F3F4F6;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        h1, h2, h3, h4, .font-heading {
            font-family: 'Outfit', sans-serif;
        }

        .glass-panel {
            background: rgba(23, 18, 38, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(168, 85, 247, 0.25);
            box-shadow: 0 15px 35px 0 rgba(0, 0, 0, 0.45);
        }

        .glass-card {
            background: rgba(30, 24, 51, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
        }

        .gradient-btn {
            background: linear-gradient(135deg, #EC4899 0%, #8B5CF6 100%);
            transition: all 0.3s ease;
        }

        .gradient-btn:hover {
            background: linear-gradient(135deg, #F43F5E 0%, #7C3AED 100%);
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.5);
        }

        .gold-btn {
            background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
            color: #000;
            font-weight: 700;
            transition: all 0.3s ease;
        }

        .gold-btn:hover {
            background: linear-gradient(135deg, #FBBF24 0%, #F59E0B 100%);
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.5);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased selection:bg-brand-magenta selection:text-white">

    <!-- Background Glow Blobs -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute -top-40 -left-40 w-96 h-96 bg-purple-600/20 rounded-full blur-3xl"></div>
        <div class="absolute top-1/3 -right-40 w-96 h-96 bg-pink-600/20 rounded-full blur-3xl"></div>
    </div>

    <!-- Header / Nav -->
    <header class="fixed top-0 left-0 right-0 z-50">
        <nav class="max-w-7xl mx-auto px-4 py-3">
            <div class="glass-panel rounded-2xl px-4 py-2.5 sm:px-6 flex items-center justify-between">
                <a href="index.html" class="flex items-center gap-3 group">
                    <img src="15_banner2.png" alt="Stars Dance Studio Logo" class="h-8 sm:h-10 w-auto object-contain filter drop-shadow-[0_0_10px_rgba(239,68,68,0.4)] group-hover:scale-105 transition-transform"[cite: 1]>
                </a>
                <div class="flex items-center gap-2">
                    <a href="index.html" class="px-3 py-2 rounded-xl glass-card text-xs font-bold text-gray-300 hover:text-white flex items-center gap-1.5">
                        <i data-lucide="home" class="w-3.5 h-3.5"></i>
                        <span>Home</span>
                    </a>
                    <a href="profile.html" class="px-3 py-2 rounded-xl glass-card text-xs font-bold text-amber-300 hover:text-white flex items-center gap-1.5">
                        <i data-lucide="user" class="w-3.5 h-3.5"></i>
                        <span>Profile</span>
                    </a>
                </div>
            </div>
        </nav>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow pt-28 pb-20 relative z-10 max-w-5xl mx-auto px-4 w-full">
        
        <div class="text-center mb-8">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-white mb-2 font-heading">Community Wall</h1>
            <p class="text-gray-400 text-xs sm:text-sm">Connect, share updates, and see what's happening at Central Valley Stars.</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- Left Side: Create Post Form -->
            <div class="lg:col-span-5 space-y-6">
                <div class="glass-panel rounded-3xl p-6 sm:p-8 border-amber-500/30 sticky top-28">
                    <h2 class="text-lg font-bold text-white mb-4 flex items-center gap-2">
                        <i data-lucide="edit-3" class="w-5 h-5 text-amber-400"></i>
                        <span>Share an Update</span>
                    </h2>

                    <form id="post-form" onsubmit="handleCreatePost(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-300 mb-1">Your Name / Handle</label>
                            <input type="text" id="post-author" required placeholder="e.g., Coach Sarah" class="w-full px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 text-white placeholder-gray-500 text-xs focus:outline-none focus:border-amber-400">
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-gray-300 mb-1">What's on your mind?</label>
                            <textarea id="post-content" required rows="4" placeholder="Share dance tips, recital excitement, or announcements..." class="w-full px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 text-white placeholder-gray-500 text-xs focus:outline-none focus:border-amber-400 resize-none"></textarea>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-gray-300 mb-1">Image URL (Optional)</label>
                            <input type="url" id="post-image" placeholder="https://example.com/photo.jpg" class="w-full px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 text-white placeholder-gray-500 text-xs focus:outline-none focus:border-amber-400">
                        </div>

                        <button type="submit" class="w-full py-3 rounded-xl gradient-btn text-white text-xs font-bold uppercase tracking-wider shadow-lg">
                            Publish Post
                        </button>
                    </form>
                </div>
            </div>

            <!-- Right Side: Live Feed Container -->
            <div class="lg:col-span-7 space-y-6">
                
                <!-- Posts Feed Container -->
                <div id="posts-feed" class="space-y-6">
                    <!-- Posts will load here dynamically -->
                </div>

                <!-- Empty State -->
                <div id="empty-feed" class="hidden glass-panel rounded-3xl p-10 text-center text-gray-400 text-xs space-y-3">
                    <i data-lucide="message-square" class="w-8 h-8 mx-auto text-gray-500"></i>
                    <p>No community posts found in the cloud yet. Be the first to share an update!</p>
                </div>

            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="py-6 border-t border-white/10 relative z-10 bg-black/50 text-gray-400 text-xs text-center">
        <p>© 2026 Central Valley Stars Dance Studio. All Rights Reserved.</p>
    </footer>

    <!-- Cloud Database & Feed Scripts -->
    <script>
        // Initialize Supabase Client with your Project credentials
        const SUPABASE_URL = 'https://lkpjbcxlczumkypuzlfg.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxrcGpiY3hsY3p1bWt5cHV6bGZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM0OTE5OTYsImV4cCI6MjEwOTA2Nzk5Nn0.0GrtS-8nMstGg9Ci23CpEdmtKG3ruE2hgfb4QHgYZY0';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let posts = [];

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            fetchPostsFromCloud();
        });

        // 1. Fetch posts permanently from Supabase
        async function fetchPostsFromCloud() {
            const { data, error } = await _supabase
                .from('posts')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error('Error fetching posts:', error);
            } else {
                posts = data || [];
                renderFeed();
            }
        }

        // 2. Save a new post permanently to Supabase
        async function handleCreatePost(e) {
            e.preventDefault();
            const author = document.getElementById('post-author').value.trim();
            const content = document.getElementById('post-content').value.trim();
            const image = document.getElementById('post-image').value.trim();

            const { data, error } = await _supabase
                .from('posts')
                .insert([{ author, content, image_url: image || null, likes: 0 }]);

            if (error) {
                alert('Error creating post: ' + error.message);
            } else {
                e.target.reset();
                fetchPostsFromCloud(); // Refresh feed from cloud database
            }
        }

        // 3. Render feed function with strict safety checks
        function renderFeed() {
            const feedContainer = document.getElementById('posts-feed');
            const emptyState = document.getElementById('empty-feed');
            
            if (!feedContainer) return;

            feedContainer.innerHTML = '';

            if (posts.length === 0) {
                if (emptyState) emptyState.classList.remove('hidden');
                return;
            } else {
                if (emptyState) emptyState.classList.add('hidden');
            }

            posts.forEach(post => {
                const card = document.createElement('div');
                card.className = 'glass-panel rounded-3xl p-5 sm:p-6 border-white/10 space-y-4';
                
                let imageHtml = post.image_url ? `<div class="rounded-2xl overflow-hidden max-h-80 bg-black/40"><img src="${post.image_url}" alt="Post image" class="w-full h-full object-cover"></div>` : '';

                card.innerHTML = `
                    <!-- Post Header -->
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-purple-500 to-pink-500 flex items-center justify-center font-bold text-white text-xs">
                                ${post.author ? post.author.charAt(0).toUpperCase() : 'U'}
                            </div>
                            <div>
                                <h4 class="text-sm font-bold text-white">${post.author}</h4>
                                <span class="text-[10px] text-gray-400">${new Date(post.created_at).toLocaleDateString()}</span>
                            </div>
                        </div>
                        <button onclick="deletePost(${post.id})" class="text-gray-500 hover:text-red-400 p-1 transition-colors" title="Delete Post">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>

                    <!-- Post Text -->
                    <p class="text-xs sm:text-sm text-gray-200 leading-relaxed">${post.content}</p>

                    <!-- Post Image -->
                    ${imageHtml}

                    <!-- Like Bar -->
                    <div class="flex items-center justify-between pt-2 border-t border-white/5 text-xs text-gray-400">
                        <span class="flex items-center gap-1.5 text-pink-400 font-bold">
                            <i data-lucide="heart" class="w-4 h-4 fill-current"></i>
                            <span>${post.likes || 0} Likes</span>
                        </span>
                    </div>
                `;
                feedContainer.appendChild(card);
            });
            
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        }

        // 4. Delete a post from Supabase
        async function deletePost(id) {
            if (confirm("Are you sure you want to delete this post?")) {
                const { error } = await _supabase
                    .from('posts')
                    .delete()
                    .eq('id', id);

                if (error) {
                    alert('Error deleting post: ' + error.message);
                } else {
                    fetchPostsFromCloud();
                }
            }
        }
    </script>
</body>
</html>
