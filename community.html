<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Feed | Central Valley Stars Dance Studio</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#0B0813',
                            card: 'rgba(23, 18, 38, 0.7)',
                            accent: '#8B5CF6',
                            purple: '#A855F7',
                            magenta: '#EC4899',
                            gold: '#F59E0B',
                            border: 'rgba(168, 85, 247, 0.2)'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Outfit', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0B0813;
            color: #F3F4F6;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        h1, h2, h3, h4, .font-heading {
            font-family: 'Outfit', sans-serif;
        }

        .glass-panel {
            background: rgba(23, 18, 38, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(168, 85, 247, 0.25);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .glass-card {
            background: rgba(30, 24, 51, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
        }

        .gradient-btn {
            background: linear-gradient(135deg, #EC4899 0%, #8B5CF6 100%);
            transition: all 0.3s ease;
        }

        .gradient-btn:hover {
            background: linear-gradient(135deg, #F43F5E 0%, #7C3AED 100%);
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.5);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased selection:bg-brand-magenta selection:text-white">

    <!-- Background Glow Blobs -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute -top-40 -left-40 w-96 h-96 bg-purple-600/20 rounded-full blur-3xl"></div>
        <div class="absolute top-1/3 -right-40 w-96 h-96 bg-pink-600/20 rounded-full blur-3xl"></div>
    </div>

    <!-- Header / Navigation Bar -->
    <header class="fixed top-0 left-0 right-0 z-50">
        <nav class="max-w-7xl mx-auto px-4 py-3">
            <div class="glass-panel rounded-2xl px-4 py-2.5 sm:px-6 flex items-center justify-between">
                <!-- Official Logo -->
                <a href="index.html" class="flex items-center gap-3 group">
                    <img src="15_banner2.png" alt="Stars Dance Studio Logo" class="h-8 sm:h-10 w-auto object-contain filter drop-shadow-[0_0_10px_rgba(239,68,68,0.4)] group-hover:scale-105 transition-transform">
                </a>
                
                <div class="flex items-center gap-2">
                    <a href="index.html" class="px-3 py-2 rounded-xl glass-card text-xs font-bold text-gray-300 hover:text-white flex items-center gap-1.5">
                        <i data-lucide="home" class="w-3.5 h-3.5"></i>
                        <span>Home</span>
                    </a>
                    <a href="store.html" class="px-3 py-2 rounded-xl glass-card text-xs font-bold text-gray-300 hover:text-white">Store</a>
                </div>
            </div>
        </nav>
    </header>

    <!-- Main Content Area with Side-by-Side Responsive Grid -->
    <main class="flex-grow pt-28 pb-20 relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full">
        
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            
            <!-- Left Column: Create Post Box (Sticks on Desktop) -->
            <div class="lg:col-span-5 lg:sticky lg:top-28">
                <div class="glass-panel rounded-3xl p-5 sm:p-6 border-amber-500/30">
                    <div class="flex items-center gap-3 mb-4">
                        <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-amber-400 to-pink-500 flex items-center justify-center font-bold text-black text-sm">
                            YOU
                        </div>
                        <div>
                            <h3 class="text-sm font-bold text-white">Create Community Post</h3>
                            <p class="text-[11px] text-gray-400">Share updates or milestones with the studio family.</p>
                        </div>
                    </div>

                    <form onsubmit="handleCreatePost(event)" class="space-y-3">
                        <input type="text" id="post-author" required placeholder="Your Name or Handle" class="w-full px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 text-white placeholder-gray-500 focus:outline-none focus:border-amber-400 text-xs">
                        
                        <textarea id="post-content" required rows="3" placeholder="What's happening in your dance journey today?" class="w-full px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 text-white placeholder-gray-500 focus:outline-none focus:border-amber-400 text-xs resize-none"></textarea>
                        
                        <input type="url" id="post-image" placeholder="Optional Image URL (https://...)" class="w-full px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 text-white placeholder-gray-500 focus:outline-none focus:border-amber-400 text-xs">

                        <div class="flex justify-end pt-1">
                            <button type="submit" class="w-full sm:w-auto px-6 py-2.5 rounded-xl gradient-btn text-white text-xs font-bold uppercase tracking-wider shadow-lg flex items-center justify-center gap-2">
                                <i data-lucide="send" class="w-3.5 h-3.5"></i>
                                <span>Post Update</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Right Column: Feed Stream Container -->
            <div class="lg:col-span-7 space-y-6">
                <div id="posts-feed" class="space-y-6">
                    <!-- Dynamically populated via JavaScript -->
                </div>

                <!-- Empty Feed State -->
                <div id="empty-feed" class="hidden glass-panel rounded-3xl p-10 text-center text-gray-400 text-xs">
                    No community posts yet. Be the first to share an update using the form!
                </div>
            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="py-6 border-t border-white/10 relative z-10 bg-black/50 text-gray-400 text-xs text-center">
        <p>© 2026 Central Valley Stars Dance Studio. All Rights Reserved.</p>
    </footer>

    <script>
        let posts = JSON.parse(localStorage.getItem('cvs_community_posts')) || [
            {
                id: 1,
                author: "Elena Rostova",
                content: "So excited for our upcoming grand opening session! The Marley floors look incredible and our dancers are ready to shine. ✨",
                image: "https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?auto=format&fit=crop&w=600&q=80",
                date: "Just now",
                likes: 12,
                likedByMe: false,
                comments: [
                    { author: "Marcus R.", text: "Can't wait to see everyone on the floor!" }
                ]
            }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            renderFeed();
        });

        function handleCreatePost(e) {
            e.preventDefault();
            const author = document.getElementById('post-author').value.trim();
            const content = document.getElementById('post-content').value.trim();
            const image = document.getElementById('post-image').value.trim();

            const newPost = {
                id: Date.now(),
                author,
                content,
                image: image || null,
                date: "Just now",
                likes: 0,
                likedByMe: false,
                comments: []
            };

            posts.unshift(newPost);
            saveAndRefresh();
            e.target.reset();
        }

        function saveAndRefresh() {
            localStorage.setItem('cvs_community_posts', JSON.stringify(posts));
            renderFeed();
        }

        function renderFeed() {
            const feedContainer = document.getElementById('posts-feed');
            const emptyState = document.getElementById('empty-feed');
            feedContainer.innerHTML = '';

            if (posts.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            posts.forEach(post => {
                const card = document.createElement('div');
                card.className = 'glass-panel rounded-3xl p-5 sm:p-6 border-white/10 space-y-4';
                
                let imageHtml = post.image ? `<div class="rounded-2xl overflow-hidden max-h-80 bg-black/40"><img src="${post.image}" alt="Post image" class="w-full h-full object-cover"></div>` : '';
                
                let commentsHtml = '';
                post.comments.forEach((c) => {
                    commentsHtml += `
                        <div class="bg-white/5 rounded-xl p-2.5 text-xs flex justify-between items-start gap-2">
                            <div>
                                <span class="font-bold text-amber-300">${c.author}:</span>
                                <span class="text-gray-200">${c.text}</span>
                            </div>
                        </div>
                    `;
                });

                card.innerHTML = `
                    <!-- Post Header -->
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-purple-500 to-pink-500 flex items-center justify-center font-bold text-white text-xs">
                                ${post.author.charAt(0).toUpperCase()}
                            </div>
                            <div>
                                <h4 class="text-sm font-bold text-white">${post.author}</h4>
                                <span class="text-[10px] text-gray-400">${post.date}</span>
                            </div>
                        </div>
                        <button onclick="deletePost(${post.id})" class="text-gray-500 hover:text-red-400 p-1" title="Delete Post">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>

                    <!-- Post Text -->
                    <p class="text-xs sm:text-sm text-gray-200 leading-relaxed">${post.content}</p>

                    <!-- Post Image -->
                    ${imageHtml}

                    <!-- Like / Comment Bar -->
                    <div class="flex items-center justify-between pt-2 border-t border-white/5 text-xs text-gray-400">
                        <button onclick="toggleLike(${post.id})" class="flex items-center gap-1.5 hover:text-pink-400 transition-colors ${post.likedByMe ? 'text-pink-400 font-bold' : ''}">
                            <i data-lucide="heart" class="w-4 h-4 ${post.likedByMe ? 'fill-current' : ''}"></i>
                            <span>${post.likes} Likes</span>
                        </button>
                        <span class="text-[11px]">${post.comments.length} Comments</span>
                    </div>

                    <!-- Comments Section -->
                    <div class="space-y-2 pt-2">
                        ${commentsHtml}
                        <form onsubmit="handleAddComment(event, ${post.id})" class="flex gap-2 pt-1">
                            <input type="text" required placeholder="Write a comment..." class="flex-grow px-3 py-1.5 rounded-xl bg-white/5 border border-white/10 text-white placeholder-gray-500 focus:outline-none focus:border-amber-400 text-xs">
                            <button type="submit" class="px-3 py-1.5 rounded-xl glass-card text-xs font-bold text-amber-300 hover:text-white">Reply</button>
                        </form>
                    </div>
                `;
                feedContainer.appendChild(card);
            });
            lucide.createIcons();
        }

        function toggleLike(id) {
            posts = posts.map(p => {
                if (p.id === id) {
                    if (p.likedByMe) {
                        return { ...p, likes: p.likes - 1, likedByMe: false };
                    } else {
                        return { ...p, likes: p.likes + 1, likedByMe: true };
                    }
                }
                return p;
            });
            saveAndRefresh();
        }

        function handleAddComment(e, postId) {
            e.preventDefault();
            const input = e.target.querySelector('input');
            const text = input.value.trim();
            if (!text) return;

            posts = posts.map(p => {
                if (p.id === postId) {
                    p.comments.push({ author: "Studio Member", text });
                }
                return p;
            });
            saveAndRefresh();
        }

        function deletePost(id) {
            if (confirm("Are you sure you want to delete this post?")) {
                posts = posts.filter(p => p.id !== id);
                saveAndRefresh();
            }
        }
    </script>
</body>
</html>
