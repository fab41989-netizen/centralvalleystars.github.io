<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Central Valley Stars Dance Studio</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#0B0813',
                            card: 'rgba(23, 18, 38, 0.7)',
                            accent: '#8B5CF6',
                            purple: '#A855F7',
                            magenta: '#EC4899',
                            gold: '#F59E0B',
                            border: 'rgba(168, 85, 247, 0.2)'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Outfit', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0B0813;
            color: #F3F4F6;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        h1, h2, h3, h4, .font-heading {
            font-family: 'Outfit', sans-serif;
        }

        .glass-panel {
            background: rgba(23, 18, 38, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(168, 85, 247, 0.25);
            box-shadow: 0 15px 35px 0 rgba(0, 0, 0, 0.45);
        }

        .glass-card {
            background: rgba(30, 24, 51, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
        }

        .gradient-btn {
            background: linear-gradient(135deg, #EC4899 0%, #8B5CF6 100%);
            transition: all 0.3s ease;
        }

        .gradient-btn:hover {
            background: linear-gradient(135deg, #F43F5E 0%, #7C3AED 100%);
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.5);
        }

        .gold-btn {
            background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
            color: #000;
            font-weight: 700;
            transition: all 0.3s ease;
        }

        .gold-btn:hover {
            background: linear-gradient(135deg, #FBBF24 0%, #F59E0B 100%);
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.5);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased selection:bg-brand-magenta selection:text-white">

    <!-- Background Glow Blobs -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute -top-40 -left-40 w-96 h-96 bg-purple-600/20 rounded-full blur-3xl"></div>
        <div class="absolute top-1/3 -right-40 w-96 h-96 bg-pink-600/20 rounded-full blur-3xl"></div>
    </div>

    <!-- Header / Nav -->
    <header class="fixed top-0 left-0 right-0 z-50">
        <nav class="max-w-7xl mx-auto px-4 py-3">
            <div class="glass-panel rounded-2xl px-4 py-2.5 sm:px-6 flex items-center justify-between">
                <a href="index.html" class="flex items-center gap-3 group">
                    <img src="15_banner2.png" alt="Stars Dance Studio Logo" class="h-8 sm:h-10 w-auto object-contain filter drop-shadow-[0_0_10px_rgba(239,68,68,0.4)] group-hover:scale-105 transition-transform"[cite: 1]>
                </a>
                <div class="flex items-center gap-2">
                    <a href="login.html" class="px-3 py-2 rounded-xl glass-card text-xs font-bold text-amber-300 hover:text-white">Sign In</a>
                    <a href="index.html" class="px-3 py-2 rounded-xl glass-card text-xs font-bold text-gray-300 hover:text-white flex items-center gap-1.5">
                        <i data-lucide="home" class="w-3.5 h-3.5"></i>
                        <span>Home</span>
                    </a>
                </div>
            </div>
        </nav>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow pt-28 pb-20 relative z-10 flex items-center justify-center px-4">
        
        <div class="max-w-md w-full glass-panel rounded-3xl p-8 sm:p-10 border-amber-500/30 relative">
            
            <div class="text-center mb-6">
                <div class="w-14 h-14 bg-pink-500/20 text-pink-400 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-pink-500/30 shadow-lg">
                    <i data-lucide="user-plus" class="w-7 h-7"></i>
                </div>
                <h1 class="text-2xl font-bold text-white mb-1">Create an Account</h1>
                <p class="text-gray-400 text-xs">Join Central Valley Stars Dance Studio portal.</p>
            </div>

            <form id="signup-form" onsubmit="handleSignUp(event)" class="space-y-3.5">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-300 mb-1">First Name</label>
                        <input type="text" id="firstName" required placeholder="Maya" class="w-full px-3.5 py-2.5 rounded-xl bg-white/5 border border-white/10 text-white placeholder-gray-500 focus:outline-none focus:border-amber-400 text-xs">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-300 mb-1">Last Name</label>
                        <input type="text" id="lastName" required placeholder="Lin" class="w-full px-3.5 py-2.5 rounded-xl bg-white/5 border border-white/10 text-white placeholder-gray-500 focus:outline-none focus:border-amber-400 text-xs">
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-gray-300 mb-1">Email Address</label>
                    <input type="email" id="signup-email" required placeholder="maya@example.com" class="w-full px-3.5 py-2.5 rounded-xl bg-white/5 border border-white/10 text-white placeholder-gray-500 focus:outline-none focus:border-amber-400 text-xs">
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-gray-300 mb-1">Password</label>
                    <input type="password" id="signup-password" required placeholder="At least 6 characters" class="w-full px-3.5 py-2.5 rounded-xl bg-white/5 border border-white/10 text-white placeholder-gray-500 focus:outline-none focus:border-amber-400 text-xs">
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-gray-300 mb-1">Confirm Password</label>
                    <input type="password" id="confirm-password" required placeholder="Re-enter password" class="w-full px-3.5 py-2.5 rounded-xl bg-white/5 border border-white/10 text-white placeholder-gray-500 focus:outline-none focus:border-amber-400 text-xs">
                </div>

                <button type="submit" class="w-full py-3 rounded-xl gradient-btn text-white text-xs font-bold uppercase tracking-wider shadow-lg mt-2">
                    Register Account
                </button>
            </form>

            <div id="signup-error" class="hidden mt-3 p-2.5 rounded-xl bg-red-500/20 text-red-300 text-xs font-medium border border-red-500/30 text-center">
                ⚠️ Passwords do not match or email already exists.
            </div>

            <div id="signup-success" class="hidden mt-3 p-3 rounded-xl bg-emerald-500/20 text-emerald-300 text-xs font-medium border border-emerald-500/30 text-center">
                ✨ Account created successfully! Redirecting to login...
            </div>

            <div class="mt-6 pt-4 border-t border-white/10 text-center text-xs text-gray-400">
                Already have an account? <a href="login.html" class="text-amber-400 hover:underline font-bold">Sign In</a>
            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="py-6 border-t border-white/10 relative z-10 bg-black/50 text-gray-400 text-xs text-center">
        <p>© 2026 Central Valley Stars Dance Studio. All Rights Reserved.</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
        });

        function handleSignUp(e) {
            e.preventDefault();
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const email = document.getElementById('signup-email').value.trim();
            const password = document.getElementById('signup-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            const errBox = document.getElementById('signup-error');
            const successBox = document.getElementById('signup-success');

            errBox.classList.add('hidden');
            successBox.classList.add('hidden');

            if (password !== confirmPassword) {
                errBox.innerText = "⚠️ Passwords do not match.";
                errBox.classList.remove('hidden');
                return;
            }

            if (password.length < 6) {
                errBox.innerText = "⚠️ Password must be at least 6 characters.";
                errBox.classList.remove('hidden');
                return;
            }

            // Save user info in localStorage for demo registration persistence
            let users = JSON.parse(localStorage.getItem('cvs_registered_users')) || [];
            
            const existingUser = users.find(u => u.email === email);
            if (existingUser) {
                errBox.innerText = "⚠️ An account with this email already exists.";
                errBox.classList.remove('hidden');
                return;
            }

            users.push({ firstName, lastName, email, password });
            localStorage.setItem('cvs_registered_users', JSON.stringify(users));

            successBox.classList.remove('hidden');

            setTimeout(() => {
                window.location.href = 'login.html';
            }, 2000);
        }
    </script>
</body>
</html>
