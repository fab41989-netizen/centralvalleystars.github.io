<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Login | Central Valley Stars Dance Studio</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#0B0813',
                            card: 'rgba(23, 18, 38, 0.7)',
                            accent: '#8B5CF6',
                            purple: '#A855F7',
                            magenta: '#EC4899',
                            gold: '#F59E0B',
                            border: 'rgba(168, 85, 247, 0.2)'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Outfit', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0B0813;
            color: #F3F4F6;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        h1, h2, h3, h4, .font-heading {
            font-family: 'Outfit', sans-serif;
        }

        .glass-panel {
            background: rgba(23, 18, 38, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(168, 85, 247, 0.25);
            box-shadow: 0 15px 35px 0 rgba(0, 0, 0, 0.45);
        }

        .glass-card {
            background: rgba(30, 24, 51, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
        }

        .gold-btn {
            background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
            color: #000;
            font-weight: 700;
            transition: all 0.3s ease;
        }

        .gold-btn:hover {
            background: linear-gradient(135deg, #FBBF24 0%, #F59E0B 100%);
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.5);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased selection:bg-brand-magenta selection:text-white">

    <!-- Background Glow Blobs -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute -top-40 -left-40 w-96 h-96 bg-purple-600/20 rounded-full blur-3xl"></div>
        <div class="absolute top-1/3 -right-40 w-96 h-96 bg-pink-600/20 rounded-full blur-3xl"></div>
    </div>

    <!-- Header / Nav -->
    <header class="fixed top-0 left-0 right-0 z-50">
        <nav class="max-w-7xl mx-auto px-4 py-3">
            <div class="glass-panel rounded-2xl px-4 py-2.5 sm:px-6 flex items-center justify-between">
                <a href="index.html" class="flex items-center gap-3 group">
                    <img src="15_banner2.png" alt="Stars Dance Studio Logo" class="h-8 sm:h-10 w-auto object-contain filter drop-shadow-[0_0_10px_rgba(239,68,68,0.4)] group-hover:scale-105 transition-transform">
                </a>
                <a href="index.html" class="px-3 py-2 rounded-xl glass-card text-xs font-bold text-gray-300 hover:text-white flex items-center gap-1.5">
                    <i data-lucide="home" class="w-3.5 h-3.5"></i>
                    <span>Home</span>
                </a>
            </div>
        </nav>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow pt-28 pb-20 relative z-10 flex items-center justify-center px-4">
        
        <div class="max-w-md w-full glass-panel rounded-3xl p-8 sm:p-10 border-amber-500/30 relative">
            
            <div class="text-center mb-8">
                <div class="w-14 h-14 bg-amber-500/20 text-amber-400 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-amber-500/30 shadow-lg">
                    <i data-lucide="shield-check" class="w-7 h-7"></i>
                </div>
                <h1 class="text-2xl font-bold text-white mb-1">Secure Portal Login</h1>
                <p class="text-gray-400 text-xs">Enter your administrative credentials to continue.</p>
            </div>

            <form id="login-form" onsubmit="handleSecureLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Username / Email</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-500">
                            <i data-lucide="user" class="w-4 h-4"></i>
                        </span>
                        <input type="text" id="username" required autocomplete="username" placeholder="admin@cvstars.com" class="w-full pl-10 pr-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder-gray-500 focus:outline-none focus:border-amber-400 text-sm transition-colors">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-500">
                            <i data-lucide="lock" class="w-4 h-4"></i>
                        </span>
                        <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••••••" class="w-full pl-10 pr-12 py-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder-gray-500 focus:outline-none focus:border-amber-400 text-sm transition-colors">
                        <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-gray-400 hover:text-white">
                            <i id="eye-icon" data-lucide="eye" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <div class="flex items-center justify-between text-xs text-gray-400 pt-1">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="remember-me" class="rounded bg-white/5 border-white/10 text-amber-500 focus:ring-0">
                        <span>Remember this device</span>
                    </label>
                </div>

                <button type="submit" id="submit-btn" class="w-full py-3.5 rounded-xl gold-btn text-xs uppercase tracking-wider shadow-lg mt-2">
                    Sign In Securely
                </button>
            </form>

            <div id="error-message" class="hidden mt-4 p-3 rounded-xl bg-red-500/20 text-red-300 text-xs font-medium border border-red-500/30 text-center animate-shake">
                ⚠️ Invalid credentials. Please try again.
            </div>

            <div id="lockout-message" class="hidden mt-4 p-3 rounded-xl bg-amber-500/20 text-amber-300 text-xs font-medium border border-amber-500/30 text-center">
                🔒 Too many failed attempts. Account temporarily locked. Please wait <span id="countdown">30</span>s.
            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="py-6 border-t border-white/10 relative z-10 bg-black/50 text-gray-400 text-xs text-center">
        <p>© 2026 Central Valley Stars Dance Studio. All Rights Reserved.</p>
    </footer>

    <script>
        let failedAttempts = parseInt(localStorage.getItem('cvs_failed_attempts')) || 0;
        let lockoutTimer = parseInt(localStorage.getItem('cvs_lockout_time')) || 0;

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            checkLockoutStatus();
        });

        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                eyeIcon.setAttribute('data-lucide', 'eye-off');
            } else {
                pwdInput.type = 'password';
                eyeIcon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }

        function checkLockoutStatus() {
            const now = Date.now();
            if (lockoutTimer > now) {
                lockoutAccount();
            }
        }
