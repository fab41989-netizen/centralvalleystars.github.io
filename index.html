<script>
        // Declare _supabase globally without initializing it immediately
        let _supabase;

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            startCountdown();
            loadAllDanceFeeds();

            // Initialize Supabase safely after the DOM and config.js are fully loaded
            if (window.SUPABASE_CONFIG) {
                _supabase = supabase.createClient(
                    window.SUPABASE_CONFIG.URL, 
                    window.SUPABASE_CONFIG.ANON_KEY
                );
            } else {
                console.error("Supabase config not found! Make sure config.js is loaded correctly.");
            }
        });

        // Toggle Mobile Navigation Menu
        function toggleMobileMenu() {
            const navLinks = document.getElementById('nav-links');
            if (navLinks.classList.contains('hidden')) {
                navLinks.classList.remove('hidden');
                navLinks.classList.add('flex');
            } else {
                navLinks.classList.add('hidden');
                navLinks.classList.remove('flex');
            }
        }

        // Auto-format phone number as the user types
        function formatPhoneNumber(e) {
            let input = e.target;
            let value = input.value.replace(/\D/g, ''); 
            let formattedValue = '';

            if (value.length > 0) {
                if (value.length <= 3) {
                    formattedValue = `(${value}`;
                } else if (value.length <= 6) {
                    formattedValue = `(${value.slice(0, 3)}) ${value.slice(3)}`;
                } else {
                    formattedValue = `(${value.slice(0, 3)}) ${value.slice(3, 6)}-${value.slice(6, 10)}`;
                }
            }
            input.value = formattedValue;
        }

        const launchDate = new Date().getTime() + (30 * 24 * 60 * 60 * 1000);

        function startCountdown() {
            setInterval(() => {
                const now = new Date().getTime();
                const distance = launchDate - now;

                if (distance < 0) return;

                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                document.getElementById('days').innerText = String(days).padStart(2, '0');
                document.getElementById('hours').innerText = String(hours).padStart(2, '0');
                document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
                document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');
            }, 1000);
        }

        // Multi-Source RSS Fetcher (Dance Magazine, Dance Spirit, Gramilano)
        async function loadAllDanceFeeds() {
            const feeds = [
                { name: 'Dance Magazine', url: 'https://www.dancemagazine.com/feed', color: 'bg-purple-500/10 text-purple-400 border-purple-500/20' },
                { name: 'Dance Spirit', url: 'https://www.dancespirit.com/feed', color: 'bg-pink-500/10 text-pink-400 border-pink-500/20' },
                { name: 'Gramilano', url: 'https://www.gramilano.com/feed/', color: 'bg-amber-500/10 text-amber-400 border-amber-500/20' }
            ];

            const container = document.getElementById('external-dance-news');
            if (!container) return;

            try {
                const promises = feeds.map(async feed => {
                    try {
                        const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feed.url)}`);
                        const data = await res.json();
                        if (data.status === 'ok' && data.items) {
                            return data.items.map(item => ({
                                ...item,
                                sourceName: feed.name,
                                badgeColor: feed.color
                            }));
                        }
                    } catch (e) {
                        console.error(`Failed to load ${feed.name}:`, e);
                    }
                    return [];
                });

                const results = await Promise.all(promises);
                let allArticles = results.flat();

                allArticles.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));

                if (allArticles.length > 0) {
                    container.innerHTML = allArticles.slice(0, 3).map(item => `
                        <div class="glass-panel rounded-3xl p-5 border-white/10 flex flex-col justify-between space-y-3 hover:border-purple-500/40 transition-all group">
                            <div class="space-y-2">
                                <div class="flex items-center justify-between text-[10px] text-gray-400">
                                    <span class="px-2.5 py-0.5 rounded-full font-bold border ${item.badgeColor}">${item.sourceName}</span>
                                    <span>${new Date(item.pubDate).toLocaleDateString()}</span>
                                </div>
                                <h3 class="text-xs sm:text-sm font-bold text-white group-hover:text-amber-300 transition-colors font-heading leading-snug">
                                    <a href="${item.link}" target="_blank" rel="noopener noreferrer">${item.title}</a>
                                </h3>
                            </div>
                            <div class="pt-2 border-t border-white/5 flex items-center justify-end">
                                <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="text-[11px] font-bold text-pink-400 hover:text-pink-300 flex items-center gap-1">
                                    <span>Read Article</span>
                                    <i data-lucide="external-link" class="w-3 h-3"></i>
                                </a>
                            </div>
                        </div>
                    `).join('');
                    if (typeof lucide !== 'undefined') lucide.createIcons();
                } else {
                    container.innerHTML = `<div class="glass-panel rounded-3xl p-6 text-center text-gray-400 text-xs col-span-full">Unable to load external news feeds right now.</div>`;
                }
            } catch (err) {
                console.error('Error loading external news:', err);
                container.innerHTML = `<div class="glass-panel rounded-3xl p-6 text-center text-gray-400 text-xs col-span-full">Error connecting to news feeds.</div>`;
            }
        }

        function handleNotifySubmit(e) {
            e.preventDefault();
            const successBox = document.getElementById('notify-success');
            successBox.classList.remove('hidden');
            e.target.reset();
        }

        // Handle Public Inquiry / Registration Form Submissions via Supabase safely
        async function handleInquirySubmit(e) {
            e.preventDefault();
            
            if (!_supabase) {
                alert('Database connection is not initialized. Please check your config.js file.');
                return;
            }

            const successBox = document.getElementById('inquiry-success');
            const submitBtn = e.target.querySelector('button[type="submit"]');
            
            submitBtn.disabled = true;
            submitBtn.innerText = 'Submitting Registration...';
            successBox.classList.add('hidden');

            const newSub = {
                first_name: document.getElementById('firstName').value.trim(),
                last_name: document.getElementById('lastName').value.trim(),
                email: document.getElementById('email').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                dance_type: document.getElementById('danceType').value,
                read: false
            };

            try {
                const { data, error } = await _supabase
                    .from('cvs_dance_submissions')
                    .insert([newSub]);

                if (error) throw error;

                successBox.classList.remove('hidden');
                e.target.reset();
                
                setTimeout(() => {
                    successBox.classList.add('hidden');
                }, 5000);
            } catch (err) {
                console.error('Error submitting inquiry:', err.message);
                alert('Failed to submit registration. Please try again later.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Submit Registration';
            }
        }
    </script>
