<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central Valley Stars Dance Studio | Coming Soon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#0B0813',
                            card: 'rgba(23, 18, 38, 0.7)',
                            accent: '#8B5CF6',
                            purple: '#A855F7',
                            magenta: '#EC4899',
                            gold: '#F59E0B',
                            goldLight: '#FDE047',
                            border: 'rgba(168, 85, 247, 0.2)'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Outfit', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0B0813; color: #F3F4F6; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        h1, h2, h3, h4, .font-heading { font-family: 'Outfit', sans-serif; }
        .glass-panel { background: rgba(23, 18, 38, 0.65); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(168, 85, 247, 0.25); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
        .glass-card { background: rgba(30, 24, 51, 0.5); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); transition: all 0.3s ease; }
        .glass-card:hover { border-color: rgba(236, 72, 153, 0.5); transform: translateY(-3px); }
        .gradient-text { background: linear-gradient(135deg, #FFF 0%, #F59E0B 35%, #EC4899 70%, #A855F7 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .gradient-btn { background: linear-gradient(135deg, #EC4899 0%, #8B5CF6 100%); transition: all 0.3s ease; }
        .gradient-btn:hover { background: linear-gradient(135deg, #F43F5E 0%, #7C3AED 100%); box-shadow: 0 0 25px rgba(236, 72, 153, 0.6); }
        .gold-btn { background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%); color: #000; font-weight: 700; transition: all 0.3s ease; }
        .gold-btn:hover { background: linear-gradient(135deg, #FBBF24 0%, #F59E0B 100%); box-shadow: 0 0 25px rgba(245, 158, 11, 0.5); }
    </style>
</head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7695544937295318" crossorigin="anonymous"></script>
<body class="antialiased selection:bg-brand-magenta selection:text-white min-h-screen flex flex-col justify-between">

    <!-- Header / Nav -->
    <header class="fixed top-0 left-0 right-0 z-50">
        <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="glass-panel rounded-2xl px-4 py-3 sm:px-6 flex items-center justify-between">
                <!-- Brand Logo -->
                <a href="index.html" class="flex items-center gap-3 group">
                    <img src="15_banner2.png" alt="Stars Dance Studio Logo" class="h-9 sm:h-11 w-auto object-contain filter drop-shadow-[0_0_10px_rgba(239,68,68,0.4)] group-hover:scale-105 transition-transform">
                </a>

                <!-- Nav links -->
                <div class="flex items-center gap-3">
                    <a href="store.html" class="hidden sm:inline-block text-xs text-gray-300 hover:text-amber-400 transition-colors">Store</a>
                    <a href="donate.html" class="px-3.5 py-2 rounded-xl glass-card text-xs font-bold text-amber-300 hover:text-amber-200 border-amber-400/40 flex items-center gap-1.5">
                        <i data-lucide="calendar-heart" class="w-3.5 h-3.5"></i>
                        <span>Sponsor a Day</span>
                    </a>
                    <a href="admin.html" class="hidden sm:inline-block text-xs text-gray-300 hover:text-amber-400 transition-colors">Admin</a>
                    <a href="#notify" class="px-4 py-2 rounded-xl gold-btn text-xs uppercase tracking-wider shadow-lg flex items-center gap-2">
                        <i data-lucide="bell" class="w-3.5 h-3.5"></i>
                        <span>Get Notified</span>
                    </a>
                </div>
            </div>
        </nav>
    </header>

    <main class="flex-grow pt-32 pb-20 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full text-center">
        <h1 class="text-4xl sm:text-6xl font-extrabold mb-4">Something Extraordinary Is <br/><span class="gradient-text">Taking Center Stage.</span></h1>
        <p class="text-gray-300 max-w-xl mx-auto mb-8">Central Valley's premier state-of-the-art dance studios are opening soon.</p>
        <a href="donate.html" class="inline-block px-8 py-4 rounded-xl gold-btn text-sm uppercase tracking-wider shadow-lg">Explore Sponsor-a-Day</a>
    </main>

    <footer class="py-8 border-t border-white/10 text-center text-xs text-gray-400">
        <p>© 2026 Central Valley Stars Dance Studio. All Rights Reserved.</p>
    </footer>

    <script>document.addEventListener('DOMContentLoaded', () => lucide.createIcons());</script>
